<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Terminal de apresentação" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14px;white-space:pre}
.amb{fill:#3ee6c4} .dim{fill:#4f817a} .teal{fill:#a7f3e4} .cream{fill:#e3f6f2} .red{fill:#ff8a7a}
.bn{fill:#3ee6c4;filter:url(#glow)}
.f{opacity:0;animation:in .35s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.flick{animation:flick 6s infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.85}99%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1}.flick{animation:none}}
</style>
<defs>
