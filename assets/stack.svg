<svg xmlns="http://www.w3.org/2000/svg" width="900" height="128" viewBox="0 0 900 128" role="img" aria-label="my stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.k{animation:press 5s ease-in-out infinite}
.k .top{animation:lit 5s ease-in-out infinite;animation-delay:inherit}
.k .lbl{animation:lbl 5s ease-in-out infinite;animation-delay:inherit}
@keyframes press{0%,14%,100%{transform:translateY(0)}5%,8%{transform:translateY(5px)}}
@keyframes lit{0%,14%,100%{fill:#0d2a29;stroke:#1d5c54}5%,8%{fill:#11433d;stroke:#3ee6c4}}
@keyframes lbl{0%,14%,100%{fill:#e3f6f2}5%,8%{fill:#3ee6c4}}
.in{opacity:0;animation:in .4s ease-out forwards}
@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.k,.k .top,.k .lbl{animation:none}.in{animation:none;opacity:1}}
</style>
